<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISUAL INTELLIGENCE V8.0 · 리드미 매거진</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ---------- themes (옷) ---------- */
:root,[data-theme="paper"]{--bg:#F4F0E8;--bg2:#ECE6DA;--card:#fff;--ink:#141413;--ink2:#3d3a35;--muted:#77716a;--line:#d8d1c3;--accent:#D97757;--accent-soft:#f3dccf;--accent2:#12C95A;--accent2-soft:#d6f5e1;--ok:#0b8a3e;--warn:#8a2f17;--warn-soft:#fbe4dc;--night:#121212;--night2:#1d1d1b;--night-ink:#f4f0e8;--display:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
[data-theme="calm"]{--bg:#F3F5F8;--bg2:#E6EBF2;--card:#fff;--ink:#0F1B2D;--ink2:#2E3B4E;--muted:#6B7787;--line:#CFD7E2;--accent:#2F6FEB;--accent-soft:#DCE7FD;--accent2:#14B8A6;--accent2-soft:#D2F4EF;--ok:#0F7B5F;--warn:#9A2B2B;--warn-soft:#F8E1E1;--night:#0F1B2D;--night2:#18273D;--night-ink:#EEF2F8;--display:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
[data-theme="warm"]{--bg:#FFF3E3;--bg2:#FFE3BF;--card:#FFFBF5;--ink:#33210F;--ink2:#56391F;--muted:#94765A;--line:#F0D3AE;--accent:#E4572E;--accent-soft:#FFD9C7;--accent2:#F2A900;--accent2-soft:#FFEDB8;--ok:#5B7F16;--warn:#A12D17;--warn-soft:#FFDCD2;--night:#4A2A12;--night2:#5B3519;--night-ink:#FFF3E3;--display:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}
[data-theme="night"]{--bg:#111214;--bg2:#1B1D21;--card:#1F2227;--ink:#F2F3F5;--ink2:#C9CDD4;--muted:#8B929C;--line:#2E3239;--accent:#FF8A5B;--accent-soft:#3A2A23;--accent2:#4ADE80;--accent2-soft:#1E3326;--ok:#4ADE80;--warn:#FCA5A5;--warn-soft:#3A2224;--night:#000;--night2:#16181B;--night-ink:#F2F3F5;--display:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}
:root{--sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"Cascadia Code",Consolas,Menlo,"Pretendard Variable",Pretendard,"Malgun Gothic",monospace}
:root[data-theme]{--accent:#29D9C2}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 var(--sans);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body.beginner{font-size:17px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
code{font-family:var(--mono);font-size:.88em;background:var(--bg2);padding:.1em .4em;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.kicker{font:700 12px/1 var(--sans);letter-spacing:.14em;color:var(--accent)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.25;margin:0}
h2{font-size:clamp(28px,4.4vw,46px);font-weight:900}
h3{font-size:22px;font-weight:700}
p{margin:0 0 1em}
.lede{font-size:19px;color:var(--ink2);max-width:680px;margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font:600 12px/1 var(--sans);padding:6px 10px;border-radius:99px;background:var(--bg2)}

.topnav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topnav .wrap{display:flex;align-items:center;gap:18px;height:52px}
.brand{font:900 16px var(--display);white-space:nowrap}
.brand span{color:var(--accent)}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.toc::-webkit-scrollbar{display:none}
.toc a{font-size:13px;text-decoration:none;color:var(--ink2);padding:6px 10px;border-radius:99px;white-space:nowrap}
.toc a:hover,.toc a.on{background:var(--ink);color:var(--bg)}

.cover{padding:56px 0 40px;border-bottom:3px double var(--ink)}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:36px;gap:16px;flex-wrap:wrap}
.masthead .title{font:900 clamp(40px,8vw,88px)/.95 var(--display);letter-spacing:-.04em}
.masthead .issue{font-size:13px;text-align:right;color:var(--ink2)}
.cover-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.cover h1{font-size:clamp(32px,5.2vw,58px);font-weight:900;line-height:1.18;margin-top:14px}
.cover h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent2-soft) 62%)}
.cover .sub{font-size:18px;color:var(--ink2);margin-top:18px}
.coverlines{margin-top:28px;display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--ink)}
.coverlines div{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);font-size:14px}
.coverlines b{display:block;font:700 18px var(--display)}
.stage{position:relative;aspect-ratio:1/1;max-width:480px;margin-left:auto;width:100%}
.stage .disc{position:absolute;inset:8%;border-radius:50%;background:var(--bg2)}
.stage .s-left{position:absolute;width:40%;left:0;bottom:10%;animation:bob 4s ease-in-out infinite}
.stage .s-right{position:absolute;width:30%;right:2%;top:12%;animation:spin 18s linear infinite}
.stage .s-center{position:absolute;width:30%;left:35%;top:30%;background:var(--bg);border-radius:50%;padding:4%;animation:pulse 3.2s ease-in-out infinite}
.stage .s-hero{position:absolute;inset:12%;object-fit:contain;animation:bob 5s ease-in-out infinite}
.stage .label{position:absolute;font:700 12px var(--sans);background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:99px;white-space:nowrap}
.stage .chip{position:absolute;font:700 12px var(--mono);background:var(--bg);border:1.5px solid var(--ink);border-radius:6px;padding:4px 8px;transform:rotate(-4deg);animation:float 3s ease-in-out infinite}
.stage svg.paths{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stage .paths path{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:4 6;animation:dash 1.6s linear infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes float{50%{transform:rotate(-4deg) translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes dash{to{stroke-dashoffset:-20}}

section{padding:84px 0;border-bottom:1px solid var(--line)}
section.dark{background:var(--night);color:var(--night-ink);border:0}
section.dark .sec-no{color:var(--accent2)}
section.dark .kicker{color:var(--accent2)}
section.dark .lede,section.dark .muted{color:color-mix(in srgb,var(--night-ink) 65%,transparent)}
.sec-head{display:grid;grid-template-columns:120px 1fr;gap:24px;margin-bottom:40px}
.sec-no{font:900 64px/0.9 var(--display);color:var(--accent)}
.sec-head .kicker{margin-bottom:12px;display:block}
.blk{margin-top:28px}
.blk:first-child{margin-top:0}

.verdict{display:grid;grid-template-columns:1.2fr 1fr;gap:32px}
.bigquote{font:900 clamp(22px,3.2vw,34px)/1.4 var(--display);border-left:6px solid var(--accent2);padding-left:22px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);margin-top:28px}
.stats div{padding:14px 10px 0 0}
.stats b{display:block;font:900 34px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats b small{font-size:16px}
.stats span{font-size:13px;color:var(--muted)}
.fit{background:var(--card);border-radius:14px;padding:22px 24px;border:1px solid var(--line)}
.fit h4{margin:0 0 8px;font:700 15px var(--sans)}
.fit ul{margin:0 0 16px;padding-left:20px}
.fit li{margin:4px 0}
.fit h4.bad{color:var(--warn)}
.next{margin-top:12px;display:flex;gap:12px;align-items:center;background:var(--night);color:var(--night-ink);border-radius:12px;padding:16px 18px}
.next b{color:var(--accent2);white-space:nowrap}
.next a{color:var(--night-ink)}
.next code{background:color-mix(in srgb,var(--night-ink) 14%,transparent)}

.scenes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:16px;overflow:hidden}
.scene{padding:28px;min-height:260px;display:flex;flex-direction:column;gap:14px}
.scene + .scene{border-left:1px solid var(--ink)}
.scene .logo{height:40px;width:auto;object-fit:contain;object-position:left}
.scene .q{font:700 22px/1.4 var(--display)}
.scene.dark{background:var(--night);color:var(--night-ink)}
.scene.dark .muted{color:color-mix(in srgb,var(--night-ink) 65%,transparent)}
.bridge-line{grid-column:1/-1;border-top:1px solid var(--ink);padding:18px 28px;display:flex;align-items:center;gap:16px;background:var(--bg2)}
.bridge-line img{width:34px}

.diagram{display:grid;align-items:center}
.node{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:22px 18px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:10px;min-height:200px}
.node:hover{transform:translateY(-3px)}
.node[aria-pressed="true"]{box-shadow:6px 6px 0 var(--ink)}
.node.hub{background:var(--night);color:var(--night-ink);border-color:var(--night)}
.node .ni{height:52px;width:auto;object-fit:contain;object-position:left}
.node .nt{font:900 19px var(--display)}
.node .ns{font-size:13px;opacity:.78}
.node .chip{align-self:flex-start;font:600 11px var(--sans);padding:4px 8px;border-radius:99px;background:var(--bg2);color:var(--ink)}
.node.hub .chip{background:color-mix(in srgb,var(--night-ink) 16%,transparent);color:var(--night-ink)}
.wire{position:relative;height:60px}
.wire svg{width:100%;height:100%;overflow:visible}
.wire path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 6;animation:dash 1.4s linear infinite}
.wire .pr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 11px var(--mono);background:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:3px 7px;white-space:nowrap}
.detail{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;min-height:120px}
.detail h4{margin:0 0 6px;font:700 13px var(--sans);color:var(--accent);letter-spacing:.04em}
.detail p{margin:0;font-size:15px}
.zero{display:flex;flex-wrap:wrap;gap:8px}
.zero span{font:600 13px var(--sans);border:1px solid var(--ink);border-radius:99px;padding:6px 12px}
.zero span b{font-family:var(--display);font-weight:900;color:var(--accent)}
.callout{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--accent-soft);border-radius:12px;padding:16px 18px;font-size:15px}
.callout b.t{font:700 13px var(--sans);background:var(--ink);color:var(--bg);border-radius:6px;padding:4px 8px;white-space:nowrap}

.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dict div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;transition:transform .2s}
.dict div:hover{transform:translateY(-3px)}
.dict .dw{font:900 18px var(--display)}
.dict .dm{font-size:15px;color:var(--ink2)}
.dict .dm b{color:var(--ink)}

.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.folder{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:22px 18px 18px;margin-top:14px}
.folder:before{content:"";position:absolute;top:-14px;left:-1px;width:44%;height:14px;background:inherit;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0}
.folder .fp{font:700 18px var(--mono)}
.folder .fw{font-size:12px;font-weight:700;margin:6px 0 10px;display:inline-block;padding:3px 8px;border-radius:6px;background:var(--bg2)}
.fw.a2{background:var(--accent2-soft)} .fw.a1{background:var(--accent-soft)}
.folder p{font-size:14px;margin:0;color:var(--ink2)}

.rules{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.rules ol{margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.rules li:before{content:counter(r);font:900 18px var(--display);color:var(--accent)}
.darkbox{background:var(--night);color:var(--night-ink);border-radius:14px;padding:22px 24px}
.darkbox h4{margin:0 0 10px;font:700 15px var(--sans);color:var(--accent2)}
.darkbox h4 + p{margin-bottom:18px}
.darkbox p{font-size:15px;color:color-mix(in srgb,var(--night-ink) 82%,transparent)}
.darkbox p:last-child{margin:0}

.steps{display:grid;gap:18px}
.step{display:grid;grid-template-columns:96px 1fr;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.step .sn{background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px 0}
.step .sn b{font:900 40px/1 var(--display)}
.step .sn span{font-size:11px;letter-spacing:.1em;opacity:.7}
.step .sb{padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.step .sb.wide{grid-template-columns:1fr}
.step .where{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.step h3{margin-bottom:6px}
.step ol,.step ul{margin:6px 0 0;padding-left:20px}
.ok{margin-top:10px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap}
.ok b{color:var(--ok);white-space:nowrap}
.btn{font:700 14px var(--sans);border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:99px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--bg)}
.step-media{display:grid;grid-template-columns:240px 1fr;gap:22px;margin-top:16px;align-items:start}
figure{margin:0}
figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
pre.code{position:relative;margin:12px 0 0;background:var(--night);color:var(--night-ink);border-radius:12px;padding:42px 18px 16px;font:13.5px/1.7 var(--mono);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
pre.code .c{opacity:.55}
.copy{position:absolute;top:10px;right:10px;font:700 12px var(--sans);background:color-mix(in srgb,var(--night-ink) 16%,transparent);color:var(--night-ink);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.copy:hover{background:var(--accent)}
.prompt-wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-top:16px}
.why{list-style:none;margin:0;padding:0}
.why li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.why b.n,.anno b.n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px var(--sans)}
.note{font-size:14px;background:var(--bg2);border-radius:10px;padding:12px 14px;margin-top:12px}
.note b:first-child{color:var(--accent)}

.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.word{border:1px solid color-mix(in srgb,var(--night-ink) 20%,transparent);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:16px;background:var(--night2)}
.word .when{font:700 13px var(--sans);color:var(--accent2)}
.word .say{font:900 clamp(24px,3.2vw,34px)/1.3 var(--display)}
.word .say:before{content:"\201C";color:var(--accent)}
.word .say:after{content:"\201D";color:var(--accent)}
.word .who{display:flex;align-items:center;gap:10px;font-size:13px;color:color-mix(in srgb,var(--night-ink) 70%,transparent)}
.word .who img{height:22px;width:auto}
.word .btn{align-self:flex-start;background:transparent;color:var(--night-ink);border-color:var(--night-ink)}
.word .btn:hover{background:var(--night-ink);color:var(--night)}

.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.lane{border-top:4px solid var(--accent2);padding-top:18px}
.lane.b{border-color:var(--accent)}
.lane-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lane-h img{height:30px;width:auto}
.lane-h .arrow{font:900 18px var(--display)}
.lane-h h3{font-size:19px}
.lane ol{list-style:none;padding:0;margin:0;counter-reset:l}
.lane li{counter-increment:l;position:relative;padding:0 0 18px 44px}
.lane li:before{content:counter(l);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 13px var(--sans);background:var(--bg)}
.lane li:after{content:"";position:absolute;left:14px;top:30px;bottom:2px;border-left:1.5px dashed var(--line)}
.lane li:last-child:after{display:none}
.lane .say{display:block;margin-top:6px;font:500 14px var(--display);background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px}

.timing{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.timing .t{text-align:center}
.timing .t b{display:block;font:900 30px var(--display);font-variant-numeric:tabular-nums}
.timing .t span{font-size:12px;color:var(--muted)}
.timing .ln{height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);background-size:24px 2px;margin:0 14px;animation:slide 1.2s linear infinite}
@keyframes slide{to{background-position:24px 0}}
.timing .mid{font:700 13px var(--sans);text-align:center;padding:0 6px}

.prgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
.mock{background:#fff;border:1px solid #d0d7de;border-radius:12px;overflow:hidden;font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:#1f2328}
.mock-top{padding:18px 20px;border-bottom:1px solid #d0d7de}
.mock-title{font-size:20px;font-weight:600;line-height:1.35}
.mock-title .num{color:#59636e;font-weight:400}
.mock-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#59636e}
.mock-status{background:#1f883d;color:#fff;border-radius:99px;padding:4px 10px;font-weight:600;font-size:13px}
.mock-branch{font:12px var(--mono);background:#ddf4ff;color:#0969da;border-radius:6px;padding:2px 6px}
.mock-body{padding:18px 20px;font-size:14.5px;line-height:1.7}
.mock-body .mb{position:relative;padding:10px 34px 10px 14px;border-left:3px solid transparent;margin:0 0 6px;border-radius:0 8px 8px 0;transition:background .2s}
.mock-body .mb[data-on]{border-left-color:var(--accent);background:var(--accent-soft)}
.mock-body .h{font-weight:700}
.pin{position:absolute;right:6px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px/24px var(--sans);text-align:center}
.anno{list-style:none;margin:0;padding:0}
.anno li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.anno .k{font-weight:700;display:block}
.recon{font-size:12px;color:var(--muted);margin-top:8px}

.cases-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:0 0 16px;flex-wrap:wrap}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.case{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;transition:transform .2s}
.case:hover{transform:translateY(-3px)}
.src{align-self:flex-start;font:700 11px var(--sans);padding:4px 8px;border-radius:6px;background:var(--bg2);color:var(--ink2)}
.src.v{background:var(--accent2-soft);color:var(--ok)}
.case h3{font-size:19px}
.flow{display:flex;flex-direction:column;gap:6px;font-size:14px}
.flow div{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.flow i{font-style:normal;font:700 11px var(--sans);text-align:center;border-radius:6px;padding:3px 0;background:var(--bg2)}
.flow i.a2{background:var(--accent2-soft)} .flow i.ink{background:var(--ink);color:var(--bg)} .flow i.a1{background:var(--accent-soft)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.never{display:flex;flex-wrap:wrap;gap:8px}
.never span{font:600 14px var(--sans);padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.never span:before{content:"\00D7";margin-right:6px;font-weight:900}
.oops{counter-reset:o;list-style:none;padding:0;margin:0}
.oops li{counter-increment:o;padding:12px 0 12px 40px;position:relative;border-bottom:1px solid var(--line);font-size:15px}
.oops li:before{content:counter(o);position:absolute;left:0;top:12px;width:26px;height:26px;border-radius:6px;background:var(--warn);color:var(--bg);font:700 13px/26px var(--sans);text-align:center}
.pull{margin:0;font:900 clamp(22px,3.4vw,34px)/1.4 var(--display);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:26px 0}
.pull small{display:block;font:500 13px var(--sans);color:var(--muted);margin-top:10px}

details.faq{border-bottom:1px solid var(--line)}
details.faq summary{list-style:none;cursor:pointer;padding:18px 40px 18px 0;font:700 18px var(--display);position:relative}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:after{content:"+";position:absolute;right:6px;top:14px;font:400 26px var(--sans);transition:transform .2s}
details.faq[open] summary:after{transform:rotate(45deg)}
details.faq .a{padding:0 0 18px;color:var(--ink2);max-width:760px}
.faqcols{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}

.agenda{display:grid;border-radius:12px;overflow:hidden;border:1px solid var(--ink)}
.agenda div{padding:14px 12px;font-size:13px;border-left:1px solid var(--ink);min-height:140px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.agenda div:first-child{border-left:0}
.agenda div.hot{background:var(--accent2-soft)}
.agenda b{font:900 15px var(--display)}
.agenda .m{font:700 12px var(--mono);color:var(--accent)}

.check-wrap{display:grid;grid-template-columns:280px 1fr;gap:36px;align-items:start}
.progress{position:sticky;top:76px;background:var(--night);color:var(--night-ink);border-radius:18px;padding:24px}
.progress b{font:900 56px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;background:color-mix(in srgb,var(--night-ink) 18%,transparent);border-radius:99px;margin:16px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent2);transition:width .4s}
.progress img{height:70px;width:auto;margin-top:12px;transition:transform .4s}
.checks{list-style:none;padding:0;margin:0}
.checks li{border-bottom:1px solid var(--line)}
.checks label{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:14px 0;cursor:pointer;font-size:16px}
.checks input{width:22px;height:22px;accent-color:var(--ok)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.checks .where{font-size:12px;color:var(--muted)}

.ledger{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ledger .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.ledger h4{margin:0 0 10px;font:700 15px var(--sans)}
.ledger ul{margin:0;padding-left:18px;font-size:14px}
.ledger li{margin:5px 0}
.box.ok h4{color:var(--ok)} .box.no h4{color:var(--warn)}
details.more{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 22px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:700}
details.more ul{font-size:13.5px;padding-left:18px}
details.more li{margin:6px 0}
.figure-wide img{border-radius:14px;border:1px solid var(--line)}
footer{padding:40px 0 60px;font-size:13px;color:var(--muted)}
footer .logos{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:14px;opacity:.85}
footer .logos img{height:24px;width:auto}

dialog{border:0;border-radius:20px;padding:0;max-width:640px;width:calc(100% - 32px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
dialog::backdrop{background:rgba(20,20,19,.55);backdrop-filter:blur(2px)}
.dlg-h{background:var(--night);color:var(--night-ink);padding:22px 26px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dlg-h .k{font:700 12px var(--sans);color:var(--accent2);letter-spacing:.1em}
.dlg-h h3{margin-top:6px;font-size:24px}
.dlg-x{background:none;border:1px solid color-mix(in srgb,var(--night-ink) 40%,transparent);color:var(--night-ink);border-radius:99px;width:36px;height:36px;font-size:18px;cursor:pointer;flex:none}
.dlg-b{padding:8px 26px 24px}
.dlg-b .row{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.dlg-b .row b{font:700 13px var(--sans);color:var(--accent)}
.dlg-b .row:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.missing{display:inline-flex;align-items:center;justify-content:center;border:1.5px dashed var(--muted);border-radius:12px;color:var(--muted);font:700 12px var(--sans);padding:8px;min-height:40px;text-align:center}

/* ---------- deck mode (넘겨 보기) ---------- */
body.deckmode{overflow:hidden;height:100vh}
.deck{position:fixed;left:0;right:0;top:53px;bottom:64px;overflow:hidden;perspective:1600px}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);transition:transform .65s cubic-bezier(.2,.7,.2,1),opacity .65s;transform-origin:50% 50%;overscroll-behavior:contain}
.slide.prev{transform:translateX(-60%) rotateY(28deg) scale(.86);opacity:0;pointer-events:none;visibility:hidden;transition:transform .65s cubic-bezier(.2,.7,.2,1),opacity .65s,visibility 0s .65s}
.slide.next{transform:translateX(60%) rotateY(-28deg) scale(.86);opacity:0;pointer-events:none;visibility:hidden;transition:transform .65s cubic-bezier(.2,.7,.2,1),opacity .65s,visibility 0s .65s}
.slide.cur{transform:none;opacity:1;visibility:visible}
.slide section{border-bottom:0;min-height:100%;padding:52px 0 64px}
.slide .cover{border-bottom:0;min-height:100%;padding-top:40px}
.slide .progress{position:static}
.deckbar{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:25;display:flex;align-items:center;gap:14px;padding:0 max(20px,calc((100% - 1080px)/2 + 28px));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.deckbar .nb{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font:700 20px/1 var(--sans);cursor:pointer;flex:none;transition:transform .15s}
.deckbar .nb:active{transform:scale(.92)}
.deckbar .nb:disabled{opacity:.25;cursor:default}
.deckbar .nb.nx{background:var(--ink);color:var(--bg)}
.deckbar .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.deckbar .tt{font:700 13px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deckbar .tt b{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:8px}
.dots{display:flex;gap:4px}
.dots button{flex:1;height:5px;border:0;border-radius:99px;background:var(--line);padding:0;cursor:pointer;transition:background .3s}
.dots button.done{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.dots button.on{background:var(--accent)}
.modebtn{font:600 12px var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:99px;padding:6px 10px;cursor:pointer;white-space:nowrap;flex:none}
.modebtn:hover{border-color:var(--ink);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.slide.prev,.slide.next{transform:none}}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease-out,transform .7s ease-out}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

@media (max-width:900px){
  .cover-grid,.verdict,.prgrid,.prompt-wrap,.two,.rules,.check-wrap,.ledger{grid-template-columns:1fr}
  .stage{margin:0 auto;max-width:380px}
  .faqcols{grid-template-columns:1fr}
  .progress{position:static}
  .diagram{grid-template-columns:1fr!important}
  .wire{height:56px}
  .wire svg{transform:rotate(90deg);width:56px;margin:0 auto;display:block}
  .agenda{grid-template-columns:1fr!important}
  .agenda div{border-left:0;border-top:1px solid var(--ink);min-height:0}
  .agenda div:first-child{border-top:0}
}
@media (max-width:640px){
  .wrap{padding:0 18px}
  section{padding:60px 0}
  .sec-head{grid-template-columns:1fr;gap:6px;margin-bottom:28px}
  .sec-no{font-size:44px}
  .scenes{grid-template-columns:1fr}
  .scene + .scene{border-left:0;border-top:1px solid var(--ink)}
  .step{grid-template-columns:1fr}
  .step .sn{flex-direction:row;justify-content:flex-start;padding:12px 20px;gap:12px}
  .step .sn b{font-size:28px}
  .step .sb{grid-template-columns:1fr;padding:18px}
  .step-media{grid-template-columns:1fr}
  .step-media figure{max-width:220px}
  .stats b{font-size:26px}
  .timing{grid-template-columns:1fr;gap:10px}
  .timing .ln{height:24px;width:2px;margin:0 auto;background:repeating-linear-gradient(180deg,var(--ink) 0 6px,transparent 6px 12px);animation:none}
  .masthead .issue{text-align:left}
  .coverlines{grid-template-columns:1fr}
  .lede{font-size:17px}
}
@media print{.topnav,.copy,.btn{display:none}.reveal{opacity:1;transform:none}section{break-inside:avoid-page}}
</style>

  deck.addEventListener('touchend',function(e){if(!tracking)return;tracking=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>1.4*Math.abs(dy))go(cur+(dx<0?1:-1))},{passive:true});
  var wl=0;deck.addEventListener('wheel',function(e){if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>25){var n=Date.now();if(n-wl>700){wl=n;go(cur+(e.deltaX>0?1:-1))}}},{passive:true});
  var start=SIDS.indexOf((location.hash||'').slice(1));go(start>=0?start+1:0,0);
  window.MV={go:go,index:function(){return cur},count:N,mode:MODE};
  if(!sessionStorage.getItem('mv-hint')){try{sessionStorage.setItem('mv-hint','1')}catch(e){}setTimeout(function(){toast.textContent=T.swipeHint;toast.classList.add('on');setTimeout(function(){toast.classList.remove('on')},2200)},900)}}
else window.MV={mode:MODE};
})();
</script>
</body>
