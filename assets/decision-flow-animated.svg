<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Visual Intelligence animated decision interface demo">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#172647"/></linearGradient>
<linearGradient id="accent" x2="1"><stop stop-color="#7C7CFF"/><stop offset="1" stop-color="#29D9C2"/></linearGradient>
<style>
text{font-family:Arial,sans-serif}.muted{fill:#94A3B8}.bright{fill:#F8FAFC}
.card{fill:#1E2A43;stroke:#3B4D6E;stroke-width:1}.pulse{animation:pulse 6s infinite}.a{animation:fadeA 6s infinite}.b{animation:fadeB 6s infinite}.c{animation:fadeC 6s infinite}
@keyframes fadeA{0%,25%{opacity:1}33%,100%{opacity:.2}}
@keyframes fadeB{0%,30%{opacity:.15}40%,62%{opacity:1}72%,100%{opacity:.15}}
@keyframes fadeC{0%,65%{opacity:.15}75%,100%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</defs>
<rect width="960" height="360" rx="24" fill="url(#bg)"/>
<rect x="26" y="25" width="908" height="310" rx="18" fill="#111B31" stroke="#344463"/>
<circle cx="52" cy="49" r="5" fill="#FF6B76"/><circle cx="70" cy="49" r="5" fill="#F7C76B"/><circle cx="88" cy="49" r="5" fill="#45D6B0"/>
<text x="116" y="54" font-size="14" fill="#9FB1CF">VISUAL INTELLIGENCE / LIVE CONCEPT</text>
<text x="50" y="103" font-size="25" font-weight="bold" class="bright">From question to clarity</text>
<text x="50" y="130" font-size="14" class="muted">An illustrative animation of the adaptive decision flow — not a captured product session</text>
<g class="a"><rect x="50" y="163" width="242" height="114" rx="14" class="card"/><text x="70" y="193" font-size="13" fill="#9BAEFF">01 · UNDERSTAND</text><text x="70" y="225" font-size="20" class="bright" font-weight="bold">What is the goal?</text><text x="70" y="251" font-size="13" class="muted">Identify the user's intent</text></g>
<path d="M300 220H332" stroke="url(#accent)" stroke-width="3"/><path d="M327 213l8 7-8 7" fill="none" stroke="#60D7D0" stroke-width="3"/>
<g class="b"><rect x="342" y="163" width="272" height="114" rx="14" class="card"/><text x="362" y="193" font-size="13" fill="#9BAEFF">02 · ADAPT</text><rect x="362" y="210" width="72" height="42" rx="7" fill="#3E4C8E"/><rect x="445" y="210" width="72" height="42" rx="7" fill="#285D68"/><rect x="528" y="210" width="66" height="42" rx="7" fill="#604779"/><text x="377" y="236" font-size="12" class="bright">Table</text><text x="462" y="236" font-size="12" class="bright">Flow</text><text x="537" y="236" font-size="12" class="bright">Explore</text></g>
<path d="M622 220H654" stroke="url(#accent)" stroke-width="3"/><path d="M649 213l8 7-8 7" fill="none" stroke="#60D7D0" stroke-width="3"/>
<g class="c"><rect x="664" y="163" width="246" height="114" rx="14" fill="#163E43" stroke="#29D9C2"/><text x="684" y="193" font-size="13" fill="#6FE7D5">03 · ACT</text><text x="684" y="225" font-size="20" class="bright" font-weight="bold">Make a decision</text><text x="684" y="251" font-size="13" fill="#A5D6D0">Clear, actionable next step</text></g>
<rect x="50" y="299" width="860" height="4" rx="2" fill="#344463"/><rect x="50" y="299" width="860" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="0;860" dur="6s" repeatCount="indefinite"/></rect>
</svg>